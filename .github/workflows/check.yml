name: Проверка модели

on:
  push:
  pull_request:

jobs:
  proverka:
    name: Проверка уравнений и расчётов
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
      - name: Настройка языка программирования
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Проверка расчётов
        run: python -m unittest discover -s tests -v
      - name: Независимая проверка уравнений
        run: python -m src.audit
      - name: Построение графиков
        run: |
          python -m src.experiment
          python -m src.stage2_foundations
