name: Сборка научной статьи на английском языке

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - 'src/**'
      - 'tests/**'
      - 'results/**'
      - 'requirements.txt'
      - 'requirements-stage2.txt'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'src/**'
      - 'tests/**'
      - 'results/**'
      - 'requirements.txt'
      - 'requirements-stage2.txt'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-paper:
    name: Проверка модели и сборка PDF через Quarto и Typst
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка шрифтов и средств проверки PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core poppler-utils
      - name: Установка зависимостей
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Установка Quarto с поддержкой Typst
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Проверка модели и исходных чисел статьи
        run: |
          python -m unittest discover -s tests -v
          python -m src.audit
          python -m src.experiment
          python -m src.stage2_equilibrium
          python -m src.stage2_foundations
          python -m paper.scripts.check_results
          python -m src.stage3_experiment
      - name: Генерация рисунков на английском языке
        run: |
          python -m paper.scripts.make_figures
          python -m paper.scripts.stage2_figures
      - name: Проверка английского текста рисунков
        run: |
          test "$(find paper/figures -maxdepth 1 -name '*.svg' | wc -l)" -eq 14
          test "$(find paper/figures/stage3 -name '*.svg' | wc -l)" -eq 18
          grep -q 'Firm-specific / Calvo' paper/figures/stage3/monetary_output.svg
          grep -q 'Flexible prices' paper/figures/monetary_output.svg
          grep -q 'Calvo pricing' paper/figures/monetary_output.svg
      - name: Сборка PDF с использованием Quarto и Typst
        env:
          SOURCE_DATE_EPOCH: '1793491200'
        run: quarto render paper/article.qmd --to typst
      - name: Проверка готового PDF, автора и языка статьи
        run: |
          test -s paper/article.pdf
          pdfinfo paper/article.pdf | grep '^Pages:'
          pdftotext -layout paper/article.pdf paper/article.txt
          grep -q 'Pitti King' paper/article.txt
          grep -q 'Bellmar Institute for Quantitative Economics' paper/article.txt
          grep -q 'Nominal Price Rigidity' paper/article.txt
          if grep -E '[А-Яа-яЁё]' paper/article.txt; then
            echo 'Найдены символы кириллицы в английской статье.' >&2
            exit 1
          fi
          rm paper/article.txt
      - name: Сохранение PDF как артефакта выполнения
        uses: actions/upload-artifact@v4
        with:
          name: dsge-paper-en-typst
          path: paper/article.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Сохранение PDF в репозитории main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/article.pdf paper/figures/stage3 results/stage3
          if ! git diff --cached --quiet; then
            git commit -m 'Обновить английскую статью в PDF'
            git push origin HEAD:main
          else
            echo 'Содержимое PDF не изменилось.'
          fi
